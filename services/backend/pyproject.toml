[project]
name = "backend-fastapi"
version = "0.1.0"
description = "Проект по лабораторной №2 devops"
authors = [{ name = "Новиков Илья", email = "nov.ilucha@yandex.ru" }]
requires-python = ">=3.13"
dependencies = [
  "fastapi (>=0.162.0,<0.163.0)",
  "pydantic (>=2.13.5,<3.0.0)",
  "asyncpg (>=0.31.0,<0.32.0)",
  "sqlalchemy[asyncio] (>=2.1.3,<3.0.0)",
  "pydantic-settings (>=2.15.0,<3.0.0)",
  "uvicorn (>=0.54.0,<0.55.0)",
]

[dependency-groups]
dev = ["debugpy (>=1.8.22,<2.0.0)"]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.ruff]
target-version = "py313"
