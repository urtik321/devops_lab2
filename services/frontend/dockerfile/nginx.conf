user                            root;
worker_processes                auto;
daemon                          off;
error_log                       /dev/stderr warn;

events {
    worker_connections          1024;
}

http {
    # настройка формата логов
    log_format  main '$remote_addr - $remote_user [$time_local]  $status '
    '"$request" $body_bytes_sent "$http_referer" '
    '"$http_user_agent" "$http_x_forwarded_for"';

    include                     /etc/nginx/mime.types;

    default_type                application/octet-stream;
    sendfile                    off;
    keepalive_timeout           65;

    access_log                  /dev/stdout main;

    # Доверяем адресам Docker-сети и внутренним подсетям
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    # Указываем, из какого заголовка брать реальный IP
    real_ip_header X-Forwarded-For;
    # Отсекаем доверенные внутренние прокси из хвоста цепочки
    real_ip_recursive on;

    server {
        listen                  80;
        root                    /usr/share/nginx/html/;
        index                   index.html;
        client_max_body_size    16m;

        # если нам приходит запрос на /, то
        # передаём по нему html страничку нашего фронта
        location / {
            try_files $uri $uri/ /index.html;
        }

        # если пришёл запрос с префиксом /api/
        # прокидываем его в наш бэкэнд.
        # мы можем указать app:5000 так как и
        # бэк и фронт находятся в одной сети докера
        location /api/ {
            proxy_pass          http://app:5000/;

            # Передача оригинальных параметров запроса
            proxy_set_header    Host $host;
            proxy_set_header    X-Real-IP $remote_addr;
            proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;
            proxy_set_header    X-Forwarded-Port $server_port;

            # Рекомендуемые параметры для стабильного соединения
            proxy_http_version  1.1;
            proxy_set_header    Connection "";
        }
    }
}
