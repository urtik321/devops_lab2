services:
  frontend:
    build:
      context: services/frontend
      dockerfile: dockerfile/Prod.Dockerfile
      args:
        vite_api_url: /api
    ports:
      - 8091:80
    volumes:
      - ./services/frontend/dockerfile/nginx.conf:/etc/nginx/nginx.conf
    entrypoint: nginx
    command: null
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started

  app:
    build:
      context: services/backend
      dockerfile: Dockerfile
    entrypoint:
      - uvicorn
      - src.main:app
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --root-path
      - /api
    volumes:
      - ./services/backend/config.json:/app/config.json
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 8090:5000
    secrets:
      - db_password

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: ${POSTGRES_DB}
    secrets:
      - db_password
    volumes:
      - pg_data:/var/lib/postgresql # Хранение данных для постгреса, чтобы они не затирались
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "sh -c 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}'",
        ]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s

volumes:
  pg_data:

secrets:
  db_password:
    file: ./secrets/db_password
